name: store-package

# Microsoft Store'a yüklenecek .msixupload paketini üretir (x64 + ARM64 tek pakette).
# Elle çalıştır: Actions → store-package → Run workflow. "v*" etiketi gönderilince de çalışır.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Store paketi
        shell: pwsh
        run: >
          msbuild src/ZeroFileCommander/ZeroFileCommander.csproj
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxBundle=Always
          "/p:AppxBundlePlatforms=x64|ARM64"
          /p:AppxPackageDir=$env:GITHUB_WORKSPACE\packages\
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageSigningEnabled=false
          /m /nologo /v:minimal

      - name: Üretilen dosyalar
        shell: pwsh
        run: Get-ChildItem packages -Recurse -Include *.msixupload, *.msixbundle | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ZeroFileCommander-StoreUpload
          path: packages/**/*.msixupload
          if-no-files-found: error
