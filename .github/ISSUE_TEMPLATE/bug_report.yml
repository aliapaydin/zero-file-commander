name: Bug report / Hata bildirimi
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Ne oldu?
      description: Steps to reproduce, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / Uygulama sürümü
      placeholder: "0.1.0"
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows sürümü
      placeholder: "Windows 11 24H2, x64"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs / Ekran görüntüsü veya log
